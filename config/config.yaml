# Self-Healing DevOps Agent Configuration
# NO AI REQUIRED - Uses rule-based detection

watchers:
  # Watch a test log file (will be created in container)
  - type: file
    path: /tmp/test-app.log
    patterns:
      - "ERROR.*"
      - "FATAL.*"
      - "Exception.*"
      - "(?i)out of memory"
      - "(?i)disk full"
      - "(?i)connection refused"
    follow: true

analyzer:
  # LLM Configuration
  # Options: none (rule-based only), gemini, openai, anthropic
  llm_provider: gemini
  model: gemini-pro
  temperature: 0.2
  max_tokens: 500
  enable_context_extraction: true
  context_lines: 50
  enable_similarity_search: false
  
  # AI Features (requires API key)
  enable_ai_fallback: true  # Use AI when no rule matches
  enable_rule_suggestions: true  # AI suggests new rules
  enable_chat: true  # Chat interface for questions
  
  # Safety Settings
  ai_auto_approve_threshold: 0.95  # Only auto-execute AI suggestions with 95%+ confidence
  suggestion_batch_size: 10  # Analyze N unhandled errors at once
  suggestion_interval_hours: 24  # How often to automatically analyze errors

actions:
  service_restart:
    enabled: true
    cooldown: 300
    max_retries: 3
    dry_run: false
    require_approval: false

  disk_cleanup:
    enabled: true
    paths:
      - /tmp
    keep_days: 7
    min_free_gb: 5
    cooldown: 3600
    dry_run: false

alerts:
  slack_webhook: null
  discord_webhook: null
  notify_on:
    - action_taken
    - action_failed
    - high_severity
