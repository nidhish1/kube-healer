services:
  - type: web
    name: kube-healer
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/agent.db
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
    autoDeploy: true
