version: '3.8'

services:
  agent:
    build: .
    container_name: kube-healer
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/agent.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
